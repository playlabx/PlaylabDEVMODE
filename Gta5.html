<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Theft Auto 5</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        iframe { width: 100vw; height: 100vh; border: none; display: block; }
    </style>
</head>
<body>

    <iframe id="game-frame" allow="autoplay; gamepad; fullscreen; keyboard; focus-without-user-activation; pointer-lock" allowfullscreen></iframe>

    <script>
        // Route through a public proxy wrapper to strip X-Frame-Options
        const targetUrl = "https://solve5.playgta5.net/?mode=sandbox";
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);
        
        document.getElementById('game-frame').src = proxyUrl;
    </script>

</body>
</html>
