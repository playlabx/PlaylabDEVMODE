<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayLab</title>

    <style>
        :root {
            --bg-color: #111113;
            --header-bg: #1a1a1e;
            --card-bg: #1a1a1e;
            --card-hover: #26262c;
            --accent-color: #ffaa00;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --badge-new: #3b82f6;
            --border-color: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--header-bg);
            border-bottom: 1px solid #27272a;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
        }

        .logo-img {
            height: 38px;
            object-fit: contain;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-container {
            position: relative;
        }

        .search-bar {
            background-color: #2c2c35;
            border: none;
            border-radius: 20px;
            padding: 8px 15px 8px 35px;
            color: white;
            width: 220px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            align-items: center;
        }

        .header-icons i:hover, .header-icons i.active {
            color: var(--accent-color);
        }

        /* Request Games Button */
        .request-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .request-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }

        /* User Profile & Auth Styling */
        #userProfile {
            display: none;
            align-items: center;
            gap: 8px;
            background: #2c2c35;
            padding: 4px 10px 4px 4px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        #userAvatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        #userName {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            max-width: 90px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
        }
        .logout-btn:hover {
            color: #dc2626;
        }

        /* Main Content Layout */
        .container {
            max-width: 1600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        section {
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            border: 1px solid #27272a;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-color);
        }

        .game-thumbnail {
            width: 100%;
            height: 120px;
            background-color: #000000;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 11px;
            border-radius: 8px 8px 0 0;
            margin-bottom: 6px;
        }

        .game-info {
            padding: 0 8px 8px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e4e4e7;
            flex-grow: 1;
        }

        .fav-star {
            color: #71717a;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
            padding: 4px;
        }

        .fav-star.favorited {
            color: #ef4444;
        }

        /* Badges */
        .badge {
            position: absolute;
            top: 5px;
            right: 5px;
            color: white;
            font-size: 9px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            z-index: 10;
        }

        .badge.new {
            background-color: var(--badge-new);
        }

        /* Game Player Modal & Control Toolbar */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-header-bar {
            width: 85%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1e;
            padding: 8px 15px;
            border-radius: 8px 8px 0 0;
            border: 1px solid var(--border-color);
            border-bottom: none;
        }

        .modal-game-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .modal-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background-color: #2c2c35;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background-color: #3f3f46;
        }

        .modal-content {
            width: 85%;
            max-width: 1000px;
            height: 75vh;
            background: #000;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-container {
            width: 85%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1e;
            padding: 8px 15px;
            border-radius: 0 0 8px 8px;
            border: 1px solid var(--border-color);
            border-top: none;
        }

        .close-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .close-btn:hover {
            background-color: #dc2626;
        }

        /* Safe Mode Floating Button */
        .safe-mode-btn {
            position: fixed;
            bottom: 15px;
            left: 15px;
            z-index: 999;
            background-color: #10b981;
            color: #ffffff;
            border: 1px solid #059669;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .safe-mode-btn.disabled {
            background-color: #3f3f46;
            color: #a1a1aa;
            border-color: #27272a;
        }

        .safe-mode-btn:hover {
            transform: scale(1.05);
        }
    </style>

    <!-- Header -->

        <div class="header-right">

                <i class="fas fa-paper-plane"></i> Request Games
            </a>

            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchBar" class="search-bar" placeholder="Search Game..." oninput="filterGames()">
            </div>

            <div class="header-icons">
                <!-- Favorites Filter Toggle -->
                <i class="fas fa-heart" id="favFilterBtn" title="View Favorites" onclick="toggleFavoritesFilter()"></i>

                <!-- Google Sign-In Button Container -->
                <div id="g_id_onload"

                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="medium" data-shape="pill"></div>

                <!-- Logged-in User Profile -->
                <div id="userProfile">
                    <img id="userAvatar" src="" alt="Avatar">
                    <span id="userName"></span>
                    <button class="logout-btn" onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <div class="container">
        <!-- Html Games Section -->
        <section>
            <div class="section-title">Html Games</div>
            <div class="game-grid" id="htmlGamesGrid"></div>
        </section>

        <!-- Other Section -->
        <section>
            <div class="section-title">Other Tools & Links</div>
            <div class="game-grid" id="otherGamesGrid"></div>
        </section>
    </div>

    <!-- Game Player Modal & Control Toolbar -->
    <div id="modal">
        <div class="modal-header-bar">
            <span class="modal-game-title" id="modalTitle">Game Title</span>
            <div class="modal-controls">
                <button class="control-btn" onclick="popOutGame()"><i class="fas fa-external-link-alt"></i> Pop Out</button>
                <button class="control-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> Fullscreen</button>
            </div>
        </div>
        <div class="modal-content" id="modalContainer">
            <iframe id="gameFrame" src="" allow="autoplay; fullscreen"></iframe>
        </div>
        <div class="close-container">
            <span id="loginPromptNotice" style="font-size: 11px; color: var(--text-muted);">Sign in with Google to save favorites & leave comments!</span>
            <button class="close-btn" onclick="closeGame()">Close Game</button>
        </div>
    </div>

    <!-- Safe Mode Floating Button -->
    <button id="safeModeBtn" class="safe-mode-btn" onclick="toggleSafeMode()">
        <i class="fas fa-shield-alt"></i> <span id="safeModeText">SAFE MODE: ON</span>
    </button>

            "Duck Life 5.html": { title: "Duck Life 5 (Treasure Hunt)", image: "https://img.tapimg.net/market/images/c7a548c2184f4780655b62f6c34655fb.png/appicon_s?t=1", section: "html" },
            "Duck Life Space.html": { title: "Duck Life Space", image: "https://www.speedrun.com/static/game/9d3z5w1l/cover.png?v=3ea2a1d", section: "html" },
            "PlayLabYapper.html": { title: "PlayLab Yapper", image: "https://res.cloudinary.com/dodmrjlqa/image/upload/v1791501681/Screenshot_2026-10-08_192042_i7v1us.png", section: "other" },
            "Duck Life Battle.html": { title: "Duck Life Battle", image: "https://img.tapimg.net/market/images/61ae5a67d0253d2ee288b2fddd7ce841.png/appicon_s?t=1", section: "html" },
            "Paper.io.html": { title: "Paper.io", image: "https://images.sftcdn.net/images/t_app-icon-s/p/ff729514-ba58-11e8-ae5c-02420a000b51/3695119343/paper-io-2-icon.webp", section: "html" },
            "Paper.io 3D.html": { title: "Paper.io 3D", image: "https://games.lol/wp-content/uploads/2023/02/paper-io-3d-pc-game.png", section: "html" },
            "Paper.io Mania.html": { title: "Paper.io Mania", image: "https://www.friv2online.com/files/images/b0/b0decddfd1a90d1b327488a62f015fb4.webp", section: "html" }
        };

        let currentGameUrl = '';
        let showOnlyFavorites = false;
        let isSafeMode = true; // Enabled by default

        // Words/Games to block completely when Safe Mode is ON
        const blockedKeywords = ['gta', 'grand theft auto', 'fnaf', 'five nights'];
        
        // Explicit words to replace/sanitize in text
        const profanityList = ['fuck', 'shit', 'bitch', 'ass', 'crap', 'bastard', 'theft'];

        window.addEventListener('DOMContentLoaded', () => {
            renderGames();
            checkSavedUser();
        });

        // Safe Mode Toggle
        function toggleSafeMode() {
            isSafeMode = !isSafeMode;
            const btn = document.getElementById('safeModeBtn');
            const btnText = document.getElementById('safeModeText');

            if (isSafeMode) {
                btn.classList.remove('disabled');
                btnText.innerText = "SAFE MODE: ON";
            } else {
                btn.classList.add('disabled');
                btnText.innerText = "SAFE MODE: OFF";
            }
            renderGames(document.getElementById('searchBar').value);
        }

        function sanitizeText(text) {
            if (!isSafeMode || !text) return text;
            let cleanText = text;
            profanityList.forEach(word => {
                const regex = new RegExp(word, 'gi');
                cleanText = cleanText.replace(regex, '***');
            });
            return cleanText;
        }

        function isGameBlocked(filename, title) {
            if (!isSafeMode) return false;
            const lowerTitle = title.toLowerCase();
            const lowerFile = filename.toLowerCase();
            return blockedKeywords.some(keyword => lowerTitle.includes(keyword) || lowerFile.includes(keyword));
        }

        // Google Sign-In JWT Decoder & Handler
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        function handleCredentialResponse(response) {
            const payload = parseJwt(response.credential);
            if (payload) {
                const user = { name: payload.name, picture: payload.picture, email: payload.email };
                localStorage.setItem('playlab_user', JSON.stringify(user));
                updateUserUI(user);
            }
        }

        function updateUserUI(user) {
            const signinElem = document.querySelector('.g_id_signin');
            const profileElem = document.getElementById('userProfile');
            if (user) {
                if (signinElem) signinElem.style.display = 'none';
                profileElem.style.display = 'flex';
                document.getElementById('userAvatar').src = user.picture;
                document.getElementById('userName').innerText = sanitizeText(user.name);
                document.getElementById('loginPromptNotice').innerText = "Logged in as " + sanitizeText(user.name) + "!";
            } else {
                if (signinElem) signinElem.style.display = 'block';
                profileElem.style.display = 'none';
                document.getElementById('loginPromptNotice').innerText = "Sign in with Google to save favorites!";
            }
        }

        function logout() {
            localStorage.removeItem('playlab_user');
            updateUserUI(null);
        }

        function checkSavedUser() {
            const saved = localStorage.getItem('playlab_user');
            if (saved) {
                updateUserUI(JSON.parse(saved));
            }
        }

        // Favorites Handling
        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem('playlab_favorites')) || [];
            } catch (e) {
                return [];
            }
        }

        function toggleFavorite(filename, event) {
            event.stopPropagation();
            const user = localStorage.getItem('playlab_user');
            if (!user) {
                alert("Please sign in with Google to save favorites!");
                return;
            }

            let favs = getFavorites();
            const index = favs.indexOf(filename);
            if (index > -1) {
                favs.splice(index, 1);
            } else {
                favs.push(filename);
            }
            localStorage.setItem('playlab_favorites', JSON.stringify(favs));
            renderGames(document.getElementById('searchBar').value);
        }

        function toggleFavoritesFilter() {
            showOnlyFavorites = !showOnlyFavorites;
            const btn = document.getElementById('favFilterBtn');
            if (showOnlyFavorites) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
            renderGames(document.getElementById('searchBar').value);
        }

        // Render Games Grid
        function renderGames(filterText = '') {
            const htmlGrid = document.getElementById('htmlGamesGrid');
            const otherGrid = document.getElementById('otherGamesGrid');

            htmlGrid.innerHTML = '';
            otherGrid.innerHTML = '';

            const favs = getFavorites();
            let htmlCount = 0;
            let otherCount = 0;

            for (const [filename, info] of Object.entries(gameConfig)) {
                let rawTitle = info.title || filename.replace('.html', '').replace(/([A-Z])/g, ' $1').trim();

                // Safe Mode filter check (Hide bad games completely)
                if (isGameBlocked(filename, rawTitle)) {
                    continue;
                }

                let title = sanitizeText(rawTitle);

                if (filterText && !title.toLowerCase().includes(filterText.toLowerCase())) {
                    continue;
                }

                const isFav = favs.includes(filename);
                if (showOnlyFavorites && !isFav) {
                    continue;
                }

                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openGame(filename, title);

                let thumbnailHtml = info.image ? `<img src="${info.image}" alt="${title}" class="game-thumbnail">` : `<div class="game-thumbnail"></div>`;
                const starClass = isFav ? "fas fa-heart fav-star favorited" : "far fa-heart fav-star";

                card.innerHTML = `
                    <span class="badge new">New</span>
                    ${thumbnailHtml}
                    <div class="game-info">
                        <div class="game-title">${title}</div>
                        <i class="${starClass}" onclick="toggleFavorite('${filename}', event)" title="Favorite"></i>
                    </div>
                `;

                if (info.section === 'other') {
                    otherGrid.appendChild(card);
                    otherCount++;
                } else {
                    htmlGrid.appendChild(card);
                    htmlCount++;
                }
            }

            if (htmlCount === 0) htmlGrid.innerHTML = '<div style="color:var(--text-muted); font-size:13px; padding:10px;">No games found.</div>';
            if (otherCount === 0) otherGrid.innerHTML = '<div style="color:var(--text-muted); font-size:13px; padding:10px;">No items found.</div>';
        }

        function filterGames() {
            const query = document.getElementById('searchBar').value;
            renderGames(query);
        }

        function openGame(url, title) {
            currentGameUrl = url;
            document.getElementById('gameFrame').src = url;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            document.getElementById('gameFrame').src = '';
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = '';
        }

        function toggleFullScreen() {
            const container = document.getElementById('modalContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) container.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function popOutGame() {
            if (currentGameUrl) {
                window.open(currentGameUrl, '_blank');
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeGame();
        });
    </script>
</body>
