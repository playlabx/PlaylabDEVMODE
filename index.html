<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayLab Arcade - Premium Gaming Hub</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0b0c10;
            --bg-card: #15171e;
            --bg-card-hover: #1e222d;
            --header-bg: rgba(18, 20, 29, 0.85);
            --accent-gold: #ffb703;
            --accent-neon: #00f0ff;
            --accent-purple: #8a2be2;
            --accent-red: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 240, 255, 0.3);
            --radius-lg: 14px;
            --radius-md: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(138, 43, 226, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2d3d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-neon);
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 28px;
            background-color: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 15px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .logo-img {
            height: 40px;
            max-width: 180px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
        }

        .logo-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* Search Bar */
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-bar {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 9px 36px 9px 40px;
            color: #fff;
            width: 240px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            background-color: rgba(255, 255, 255, 0.09);
            border-color: var(--accent-neon);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
            width: 280px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }

        .search-clear {
            position: absolute;
            right: 12px;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            display: none;
            transition: color 0.2s;
        }

        .search-clear:hover {
            color: #fff;
        }

        /* Request Games Button */
        .btn-request {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ff9100, #ff5500);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            padding: 9px 18px;
            border-radius: 30px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-request:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 85, 0, 0.5);
            background: linear-gradient(135deg, #ffa01a, #ff661a);
        }

        .btn-request i {
            font-size: 14px;
        }

        /* Category Filter Tabs Bar */
        .filter-nav {
            max-width: 1600px;
            margin: 20px auto 10px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .filter-btn.active {
            background: var(--accent-neon);
            color: #000;
            border-color: var(--accent-neon);
            font-weight: 700;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        /* Main Container */
        .container {
            max-width: 1600px;
            margin: 10px auto;
            padding: 0 24px;
        }

        section {
            margin-bottom: 35px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .section-title i {
            color: var(--accent-gold);
        }

        .game-count-badge {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        /* Game Card */
        .game-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-6px) scale(1.02);
            background-color: var(--bg-card-hover);
            border-color: var(--border-glow);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .thumbnail-container {
            width: 100%;
            height: 130px;
            position: relative;
            background: #0d0e12;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .game-card:hover .game-thumbnail {
            transform: scale(1.08);
        }

        /* Dynamic Visual Fallback thumbnail */
        .thumbnail-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1f2330, #0f1118);
            color: var(--accent-neon);
            gap: 8px;
            padding: 10px;
            text-align: center;
        }

        .thumbnail-fallback i {
            font-size: 32px;
            opacity: 0.8;
        }

        .thumbnail-fallback span {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .game-info {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-card);
            flex-grow: 1;
            justify-content: space-between;
        }

        .game-title {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        .game-category-tag {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Favorite Heart Button on Card */
        .fav-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border: none;
            color: rgba(255, 255, 255, 0.7);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s ease;
        }

        .fav-btn:hover {
            transform: scale(1.15);
            color: #ff4757;
            background: rgba(0, 0, 0, 0.8);
        }

        .fav-btn.active {
            color: #ff4757;
            background: rgba(0, 0, 0, 0.85);
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        /* Badges */
        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            z-index: 10;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .badge.new {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .badge.hot {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
        }

        .badge.popular {
            background: linear-gradient(135deg, #10b981, #047857);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border-color);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 12px;
            color: #4b5563;
        }

        .empty-state h3 {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        /* Game Player Modal */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(4, 5, 8, 0.94);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-wrapper {
            width: 90%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            height: 85vh;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.2);
            border: 1px solid var(--border-color);
        }

        .modal-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #151720;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-game-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-neon);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .control-btn {
            background-color: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-btn:hover {
            background-color: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .modal-content {
            width: 100%;
            flex-grow: 1;
            background: #000;
            position: relative;
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .close-container {
            display: flex;
            justify-content: flex-end;
            background: #151720;
            padding: 10px 20px;
            border-top: 1px solid var(--border-color);
        }

        .close-btn {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .close-btn:hover {
            background-color: #dc2626;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            header {
                padding: 12px 16px;
            }
            .search-bar {
                width: 160px;
            }
            .search-bar:focus {
                width: 190px;
            }
            .logo-text {
                font-size: 18px;
            }
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 12px;
            }
            .thumbnail-container {
                height: 100px;
            }
            .modal-wrapper {
                width: 95%;
                height: 90vh;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <header>
        <a class="logo-container" onclick="resetFilter()">
            <img src="https://res.cloudinary.com/dodmrjlqa/image/upload/v1791501681/Screenshot_2026-10-08_192042_i7v1us.png" 
                 alt="PlayLab Arcade Logo" 
                 class="logo-img" 
                 onerror="this.style.display='none'; document.getElementById('logoText').style.display='block';">
            <span id="logoText" class="logo-text" style="display: none;"><i class="fas fa-gamepad"></i> PlayLab</span>
        </a>

        <div class="header-right">
            <!-- Search Bar -->
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchBar" class="search-bar" placeholder="Search games..." oninput="handleSearch()">
                <i class="fas fa-times search-clear" id="searchClear" onclick="clearSearch()"></i>
            </div>

            <!-- Request Games Button -->
            <a href="https://forms.gle/utxpmYeGZoXKc6kx9" target="_blank" class="btn-request">
                <i class="fas fa-paper-plane"></i> Request Games
            </a>
        </div>
    </header>

    <!-- Category Filters -->
    <div class="filter-nav">
        <button class="filter-btn active" onclick="setCategory('all', this)">
            <i class="fas fa-border-all"></i> All Games
        </button>
        <button class="filter-btn" onclick="setCategory('favorites', this)">
            <i class="fas fa-heart" style="color: #ff4757;"></i> Favorites (<span id="favCount">0</span>)
        </button>
        <button class="filter-btn" onclick="setCategory('html', this)">
            <i class="fas fa-code"></i> HTML Games
        </button>
        <button class="filter-btn" onclick="setCategory('other', this)">
            <i class="fas fa-cubes"></i> Tools & Proxies
        </button>
    </div>

    <!-- Main Game Display Area -->
    <div class="container">
        <!-- Dynamic Game Section -->
        <section id="gamesSection">
            <div class="section-header">
                <div class="section-title">
                    <i class="fas fa-fire"></i> <span id="sectionTitleText">All Games</span>
                </div>
                <span class="game-count-badge" id="gameCounter">0 Games</span>
            </div>
            
            <div class="game-grid" id="mainGameGrid">
                <!-- Dynamically Populated Cards -->
            </div>
        </section>
    </div>

    <!-- Game Player Modal -->
    <div id="modal">
        <div class="modal-wrapper">
            <div class="modal-header-bar">
                <span class="modal-game-title" id="modalTitle"><i class="fas fa-gamepad"></i> Game Title</span>
                <div class="modal-controls">
                    <button class="control-btn" onclick="popOutGame()"><i class="fas fa-external-link-alt"></i> Pop Out</button>
                    <button class="control-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> Fullscreen</button>
                </div>
            </div>
            <div class="modal-content" id="modalContainer">
                <iframe id="gameFrame" src="" allow="autoplay; fullscreen; keyboard" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
            </div>
            <div class="close-container">
                <button class="close-btn" onclick="closeGame()"><i class="fas fa-times"></i> Close Game</button>
            </div>
        </div>
    </div>

            "githubsearch.html": { title: "GitHub Search", image: "https://imgs.search.brave.com/FG6H6NLOUaGGHa3W_4ioeHDQ6WCY63lTBuucjyVFdAw/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9jZG4u/aWNvbnNjb3V0LmNv/bS9pY29uL2ZyZWUv/cG5nLTI1Ni9mcmVl/LWdpdGh1Yi1pY29u/LXN2Zy1kb3dubG9h/ZC1wbmctMzE0OTkx/Mi5wbmc_Zj13ZWJw/Jnc9MTI4", section: "other" }
        };

        // State Management
        let favorites = JSON.parse(localStorage.getItem('playlab_favorites')) || [];
        let currentCategory = 'all';
        let currentSearchQuery = '';
        let currentGameUrl = '';

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            updateFavCount();
            renderGames();

            // Keyboard ESC shortcut to close modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeGame();
                }
            });
        });

        // Update Favorite Count Display
        function updateFavCount() {
            document.getElementById('favCount').innerText = favorites.length;
        }

        // Toggle Favorite Status for a game
        function toggleFav(event, filename) {
            event.stopPropagation(); // Prevent opening modal
            const index = favorites.indexOf(filename);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(filename);
            }
            localStorage.setItem('playlab_favorites', JSON.stringify(favorites));
            updateFavCount();
            renderGames();
        }

        // Render Games in Grid
        function renderGames() {
            const grid = document.getElementById('mainGameGrid');
            grid.innerHTML = '';

            let count = 0;

            for (const [filename, info] of Object.entries(gameConfig)) {
                const title = info.title || filename.replace('.html', '');
                const isFav = favorites.includes(filename);

                // Category Filter Logic
                if (currentCategory === 'favorites' && !isFav) continue;
                if (currentCategory === 'html' && info.section !== 'html') continue;
                if (currentCategory === 'other' && info.section !== 'other') continue;

                // Search Query Filter Logic
                if (currentSearchQuery && !title.toLowerCase().includes(currentSearchQuery.toLowerCase())) {
                    continue;
                }

                count++;

                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openGame(filename, title);

                // Badge Markup
                let badgeHtml = '';
                if (info.badge) {
                    badgeHtml = `<span class="badge ${info.badge}">${info.badge}</span>`;
                }

                // Thumbnail or Fallback
                let thumbnailMarkup = '';
                if (info.image && info.image.trim() !== '') {
                    thumbnailMarkup = `
                        <img src="${info.image}" 
                             alt="${title}" 
                             class="game-thumbnail" 
                             onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\\'thumbnail-fallback\\'><i class=\\'fas fa-gamepad\\'></i><span>${title}</span></div>';">
                    `;
                } else {
                    thumbnailMarkup = `
                        <div class="thumbnail-fallback">
                            <i class="fas fa-gamepad"></i>
                            <span>${title}</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${filename}')" title="${isFav ? 'Remove Favorite' : 'Add Favorite'}">
                        <i class="fas fa-heart"></i>
                    </button>
                    ${badgeHtml}
                    <div class="thumbnail-container">
                        ${thumbnailMarkup}
                    </div>
                    <div class="game-info">
                        <div class="game-title" title="${title}">${title}</div>
                        <div class="game-category-tag">${info.section === 'other' ? 'Tool / Link' : 'HTML Game'}</div>
                    </div>
                `;

                grid.appendChild(card);
            }

            // Update Counter
            document.getElementById('gameCounter').innerText = `${count} ${count === 1 ? 'Game' : 'Games'}`;

            // Show Empty State if No Matches
            if (count === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-ghost"></i>
                        <h3>No games found</h3>
                        <p>Try searching for something else or check back later!</p>
                    </div>
                `;
            }
        }

        // Category Selection
        function setCategory(category, btnElement) {
            currentCategory = category;
            
            // Active Tab Class
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            // Update Title Header Text
            const titles = {
                'all': 'All Games',
                'favorites': 'Your Favorites',
                'html': 'HTML Games',
                'other': 'Tools & Proxies'
            };
            document.getElementById('sectionTitleText').innerText = titles[category] || 'Games';

            renderGames();
        }

        // Search Input Handler
        function handleSearch() {
            const searchInput = document.getElementById('searchBar');
            const clearBtn = document.getElementById('searchClear');
            currentSearchQuery = searchInput.value.trim();

            clearBtn.style.display = currentSearchQuery ? 'block' : 'none';
            renderGames();
        }

        // Clear Search Query
        function clearSearch() {
            const searchInput = document.getElementById('searchBar');
            searchInput.value = '';
            currentSearchQuery = '';
            document.getElementById('searchClear').style.display = 'none';
            renderGames();
        }

        // Reset Filter (Click Logo)
        function resetFilter() {
            clearSearch();
            const firstBtn = document.querySelector('.filter-btn');
            setCategory('all', firstBtn);
        }

        // Modal Controls
        function openGame(url, title) {
            currentGameUrl = url;
            document.getElementById('gameFrame').src = url;
            document.getElementById('modalTitle').innerHTML = `<i class="fas fa-gamepad"></i> ${title}`;
            document.getElementById('modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            document.getElementById('gameFrame').src = '';
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = '';
        }

        function toggleFullScreen() {
            const container = document.getElementById('modalContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function popOutGame() {
            if (currentGameUrl) {
                window.open(currentGameUrl, '_blank');
            }
        }
    </script>
