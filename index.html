<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayLab Arcade</title>
    <!-- Font Awesome for category icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #111113;
            --header-bg: #1a1a1e;
            --card-bg: #1a1a1e;
            --card-hover: #26262c;
            --accent-color: #ffaa00;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --badge-new: #3b82f6;
            --border-color: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--header-bg);
            border-bottom: 1px solid #27272a;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
        }

        .logo-img {
            height: 38px;
            object-fit: contain;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-container {
            position: relative;
        }

        .search-bar {
            background-color: #2c2c35;
            border: none;
            border-radius: 20px;
            padding: 8px 15px 8px 35px;
            color: white;
            width: 220px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        /* Main Content Layout */
        .container {
            max-width: 1600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        section {
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }

        .section-title span {
            font-size: 13px;
            color: var(--accent-color);
            cursor: pointer;
            font-weight: 600;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-3px);
        }

        .game-thumbnail {
            width: 100%;
            height: 120px;
            background-color: #000000; /* Black logo fallback */
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 11px;
            border-radius: 8px;
            margin-bottom: 6px;
        }

        .game-info {
            padding: 0 4px 6px 4px;
        }

        .game-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e4e4e7;
        }

        /* Badges */
        .badge {
            position: absolute;
            top: 5px;
            right: 5px;
            color: white;
            font-size: 9px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 0 8px 0 8px;
            text-transform: uppercase;
            z-index: 10;
        }

        .badge.new {
            background-color: var(--badge-new);
        }

        /* Game Player Modal & Control Toolbar */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-header-bar {
            width: 85%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1e;
            padding: 8px 15px;
            border-radius: 8px 8px 0 0;
            border: 1px solid var(--border-color);
            border-bottom: none;
        }

        .modal-game-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .modal-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background-color: #2c2c35;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background-color: #3f3f46;
        }

        .modal-content {
            width: 85%;
            max-width: 1000px;
            height: 75vh;
            background: #000;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-container {
            width: 85%;
            max-width: 1000px;
            display: flex;
            justify-content: flex-end;
            background: #1a1a1e;
            padding: 8px 15px;
            border-radius: 0 0 8px 8px;
            border: 1px solid var(--border-color);
            border-top: none;
        }

        .close-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .close-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-container">
            <img src="https://res.cloudinary.com/dodmrjlqa/image/upload/v1791501681/Screenshot_2026-10-08_192042_i7v1us.png" alt="GAMES Logo" class="logo-img">
        </div>

        <div class="header-right">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchBar" class="search-bar" placeholder="Search Game..." oninput="filterGames()">
            </div>
            <div class="header-icons">
                <i class="fas fa-heart"></i>
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <div class="container">
        <!-- Html Games Section -->
        <section>
            <div class="section-title">Html Games <span>View more ›</span></div>
            <div class="game-grid" id="htmlGamesGrid">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- Other Section -->
        <section>
            <div class="section-title">Other</div>
            <div class="game-grid" id="otherGamesGrid">
                <!-- Dynamically populated -->
            </div>
        </section>
    </div>

    <!-- Game Player Modal & Control Toolbar -->
    <div id="modal">
        <div class="modal-header-bar">
            <span class="modal-game-title" id="modalTitle">Game Title</span>
            <div class="modal-controls">
                <button class="control-btn" onclick="popOutGame()"><i class="fas fa-external-link-alt"></i> Pop Out</button>
                <button class="control-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> Fullscreen</button>
            </div>
        </div>
        <div class="modal-content" id="modalContainer">
            <iframe id="gameFrame" src="" allow="autoplay; fullscreen"></iframe>
        </div>
        <div class="close-container">
            <button class="close-btn" onclick="closeGame()">Close Game</button>
        </div>
    </div>

    <script>
        // ==========================================
        // EDIT GAME NAMES & IMAGES HERE AT THE TOP
        // If a file isn't listed here, it auto-detects 
        // with its filename and uses a black logo!
        // ==========================================
        const gameConfig = {
            "clsubwaysurfersberlin.html": { title: "Subway Surfers", image: "https://imgs.search.brave.com/FZ2YciuLR4g1n-8VLNzHyTAlrFzZS93DFupJMyjzhcQ/rs:fit:500:0:0:0/g:ce/aHR0cHM6Ly93d3cu/bWV0YWNyaXRpYy5j/b20vYS9pbWcvcmVz/aXplL2Y3NWVkMjdm/NGRjNDlhZmRiNjcx/ZTQ4YmQ1OGI4NWFm/N2M0MTFiMWUvY2F0/YWxvZy9wcm92aWRl/ci82LzEyLzYtMS0y/MzY1ODQtNTIuanBn/P2F1dG89d2VicCZm/aXQ9Y29udGFpbiZo/ZWlnaHQ9NDgwJnF1/YWxpdHk9NzA", section: "html" },
            "GeometryDashLite.html": { title: "Geometry Dash Lite", image: "https://cdn2.steamgriddb.com/logo_thumb/a1a2d4c37bcf89723258332b069889b0.png", section: "html" },
            "amongus.html": { title: "Among Us", image: "https://logodix.com/logo/2207096.png", section: "html" },
            "baldisbasics.html": { title: "Baldi Basics", image: "https://imgs.search.brave.com/_M_YSNCfcFVBdqTwQCW2KAsnIUnIsnWbN2eot0dNX-I/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3Jp/Z2luYWxzLzgzLzNl/LzcwLzgzM2U3MDRl/Y2RlZmRiZGIyZGU2/ODMwY2EwZmI1MGM0/LmpwZw", section: "html" },
            "retrobowl.html": { title: "Retro Bowl", image: "https://imgs.search.brave.com/JM9PMIqz3Bhev_4p0wlyd2o70hN17bjtxXh_0SU4g5Q/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9yZXRy/b2Jvd2wyNS5jb20v/Y2FjaGUvZGF0YS9p/bWFnZS9nYW1lL3Jl/dHJvLWJvd2wtMjYt/bTMwMHgzMDAuanBn", section: "html" },
            "Snake Game.html": { title: "Snake Game", image: "https://snake.io/assets/design/home/app_icon_snakeio.webp?v=1.3.33", section: "html" },
            "totm.html": { title: "totm", image: "https://www.jopi.com/cdn-cgi/image/quality=78,width=256,height=142,fit=cover,f=auto/img/t/tomb-of-the-mask.png", section: "html" },
            "FNAF.html": { title: "FNAF", image: "https://imgs.search.brave.com/fSbVA-1vvx55GF7FI2MEXb-3zd_QpjVd9QE-KocvnbQ/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3Jp/Z2luYWxzLzE0LzM4/LzY1LzE0Mzg2NWM5/ZTQzYmYyMmQwZTBh/ZWIyNjBkNzZmODc4/LmpwZw", section: "html" },
            "bitlife.html": { title: "BitLife", image: "https://play-lh.googleusercontent.com/fUM-UyywXxjC8soxAZdIlxJrlRRXmql8wkE426SHzft4lJycSKVd2jCYQQX1BEG9Xw=w480-h960-rw", section: "html" },
            "taproad.html": { title: "Tap Road", image: "https://imgs.search.brave.com/0FuM_0oDxKIbxPXS95zrfIM3DS94uZqCft8aNzFyYAE/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pbWcu/cm9ja2V0Z2FtZXMu/aW8vYmlnL2dhbWVz/L3QvdGFwLXJvYWQv/dGFwLXJvYWQuZDll/NmIwLmpwZw", section: "html" }, // Added with black logo fallback
            "gta5Links.html": { title: "GTA5 LINKS", image: "https://imgs.search.brave.com/1WbtVqFLX1_VvIvUo9TyMNfEnVZjAfFx4MN6r6HLd6E/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/ZnJlZXBuZ2xvZ29z/LmNvbS91cGxvYWRz/L2d0YS01LWxvZ28t/cG5nL2d0YS01LWNy/ZXctZW1ibGVtLXRy/YW5zcGFyZW50LWJh/Y2tncm91bmQtMTgu/cG5n", section: "other" }, // Added with black logo fallback
             "Gta5.html": { title: "Grand Theft Auto 5", image: "https://imgs.search.brave.com/ehzBQvGGN89477X_T91djJMS0XvH7WUzon7h02eKe28/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/aWdyYW5kdGhlZnRh/dXRvLmNvbS9jb250/ZW50L2ltYWdlcy9n/YWxsZXJ5LzM2MTct/Z3RhNS1ndGEtdi1j/b3Zlci1hcnQuanBn/P2V0YWc9NTE1YWZm/Njc", section: "html" }, // Added with black logo fallback
            "githubsearch.html": { title: "Github Search", image: "https://imgs.search.brave.com/FG6H6NLOUaGGHa3W_4ioeHDQ6WCY63lTBuucjyVFdAw/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9jZG4u/aWNvbnNjb3V0LmNv/bS9pY29uL2ZyZWUv/cG5nLTI1Ni9mcmVl/LWdpdGh1Yi1pY29u/LXN2Zy1kb3dubG9h/ZC1wbmctMzE0OTkx/Mi5wbmc_Zj13ZWJw/Jnc9MTI4", section: "other" }
        };

        let currentGameUrl = '';

        // Auto-load game cards on page startup
        window.addEventListener('DOMContentLoaded', () => {
            renderGames();
        });

        function renderGames(filterText = '') {
            const htmlGrid = document.getElementById('htmlGamesGrid');
            const otherGrid = document.getElementById('otherGamesGrid');
            
            htmlGrid.innerHTML = '';
            otherGrid.innerHTML = '';

            for (const [filename, info] of Object.entries(gameConfig)) {
                let title = info.title || filename.replace('.html', '').replace(/([A-Z])/g, ' $1').trim();
                
                // Search filter match check
                if (filterText && !title.toLowerCase().includes(filterText.toLowerCase())) {
                    continue;
                }

                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openGame(filename, title);

                // Thumbnail image or black fallback box
                let thumbnailHtml = '';
                if (info.image && info.image.trim() !== '') {
                    thumbnailHtml = `<img src="${info.image}" alt="${title}" class="game-thumbnail">`;
                } else {
                    thumbnailHtml = `<div class="game-thumbnail" style="background-color: #000000;"></div>`;
                }

                card.innerHTML = `
                    <span class="badge new">New</span>
                    ${thumbnailHtml}
                    <div class="game-info">
                        <div class="game-title">${title}</div>
                    </div>
                `;

                if (info.section === 'other') {
                    otherGrid.appendChild(card);
                } else {
                    htmlGrid.appendChild(card);
                }
            }
        }

        function filterGames() {
            const query = document.getElementById('searchBar').value;
            renderGames(query);
        }

        function openGame(url, title) {
            currentGameUrl = url;
            document.getElementById('gameFrame').src = url;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            document.getElementById('gameFrame').src = '';
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = '';
        }

        function toggleFullScreen() {
            const container = document.getElementById('modalContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function popOutGame() {
            if (currentGameUrl) {
                window.open(currentGameUrl, '_blank');
            }
        }
    </script>
</body>
</html>
